<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - HireNest</title>
    <link rel="icon" href="assets/images/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="nav"></div>
    <main class="wrap">
        <div class="auth-page">
            <div class="card">
                <h1>Welcome back</h1>
                <p class="mut" style="text-align:center">Login to apply for jobs and track your applications.</p>

                <form id="loginForm" novalidate>
                    <div class="f">
                        <label for="email">Email address</label>
                        <input type="email" id="email" placeholder="you@example.com">
                        <div class="err" id="e-email"></div>
                    </div>
                    <div class="f">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password">
                        <div class="err" id="e-password"></div>
                    </div>
                    <label class="ck"><input type="checkbox" id="showPw"> Show password</label>
                    <button class="btn" type="submit">Login</button>
                </form>

                <p class="auth-note mut">New to HireNest? <a href="signup.html">Create an account</a></p>
            </div>
        </div>
    </main>
    <footer class="foot">© 2026 HireNest. Find your next opportunity.</footer>
    <div id="toasts" aria-live="polite"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
