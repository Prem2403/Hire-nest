<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HireNest - Find your next opportunity</title>
    <link rel="icon" href="assets/images/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="nav"></div>
    <main class="wrap">
        <section class="hero">
            <h1>Find a job that fits your future</h1>
            <p>Find your next opportunity.</p>
            <form class="search" id="heroForm"><input id="hq" placeholder="Job title, skills or company"
                    aria-label="Job title, skills or company"><input id="hl" placeholder="Location"
                    aria-label="Location"><button class="btn">Search Jobs</button></form>
        </section>
        <h2>Popular Categories</h2>
        <div class="cats" id="cats"></div>
        <h2>Top Hiring Companies</h2>
        <div class="grid" id="companies"></div>
        <h2>Featured Jobs</h2>
        <div class="grid" id="featured"></div>
        <div class="stats">
            <div><b>10,000+</b>
                <p class="mut">Jobs</p>
            </div>
            <div><b>2,500+</b>
                <p class="mut">Companies</p>
            </div>
            <div><b>5,000+</b>
                <p class="mut">Candidates</p>
            </div>
        </div>
    </main>
    <footer class="foot">© 2026 HireNest. Find your next opportunity.</footer>
    <div id="toasts" aria-live="polite"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/jobs.js"></script>
</body>

</html>
